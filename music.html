<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Song 🎵</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="music.css">
</head>

<body>

    <div class="floating-hearts">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
    </div>

    <nav class="navbar">

        <a href="index.html" class="nav-logo">♡ 예림</a>

        <div class="nav-links">
            <a href="love-letter.html">Love Letter</a>
            <a href="pictures.html">My Favourite Pictures</a>
            <a href="open-when.html">Open When...</a>
            <a href="reasons.html">Reasons I Love You</a>
            <a href="music.html" class="active">Our Song</a>
            <a href="surprise.html">Surprise</a>
        </div>

    </nav>

    <main class="page music-page">

        <section class="player">

            <p class="player-header">Now Playing</p>

            <div class="cover-wrap">
                <img id="cover" class="cover" src="images/song-cover.jpg" alt="Song cover">
                <button id="likeButton" class="like-badge liked" aria-label="Favourite">♥</button>
            </div>

            <h3 id="songTitle" class="song-title">Song title</h3>
            <p id="songArtist" class="song-artist">Artist</p>

            <div class="progress-row">
                <input type="range" id="progress" class="slider" min="0" max="100" value="0" step="0.1" aria-label="Seek">
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">

                <button id="shuffleButton" class="ctrl" aria-label="Shuffle" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>

                <button id="prevButton" class="ctrl" aria-label="Previous">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" fill="none"/></svg>
                </button>

                <button id="playButton" class="ctrl play-btn" aria-label="Play or pause">
                    <svg class="icon-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                </button>

                <button id="nextButton" class="ctrl" aria-label="Next">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" fill="none"/></svg>
                </button>

                <button id="repeatButton" class="ctrl" aria-label="Repeat" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>

            </div>

            <div class="volume-row">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
                <input type="range" id="volume" class="slider" min="0" max="100" value="80" aria-label="Volume">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none"/><path d="M19 5a10 10 0 0 1 0 14" fill="none"/></svg>
            </div>

        </section>

        <audio id="audio" preload="metadata"></audio>

    </main>

    <script src="script.js"></script>
    <script src="music.js"></script>

</body>
</html>
